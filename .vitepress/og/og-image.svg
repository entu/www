<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display { font-family: 'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', 'Menlo', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fbfbfa"/>
  <rect x="0" y="0" width="1200" height="6" fill="#e8452c"/>

  <!-- ===== Left column: text ===== -->
  <text x="80" y="150" class="mono" font-size="21" letter-spacing="3" fill="#e8452c">NO-CODE OBJECT DATABASE</text>

  <text x="78" y="244" class="display" font-size="52" font-weight="700" fill="#141414" letter-spacing="-1.2">A home for everything</text>
  <text x="78" y="308" class="display" font-size="52" font-weight="700" fill="#141414" letter-spacing="-1.2">you keep track of.</text>

  <text x="80" y="404" class="display" font-size="25" fill="#555">Books, invoices, artefacts, people — stored as</text>
  <text x="80" y="440" class="display" font-size="25" fill="#555">entities with the fields you choose.</text>

  <!-- Wordmark -->
  <rect x="80" y="516" width="26" height="26" rx="6" fill="#e8452c"/>
  <text x="118" y="537" class="display" font-size="27" font-weight="700" fill="#141414">Entu</text>
  <text x="196" y="537" class="display" font-size="21" fill="#999">· entu.ee</text>

  <!-- ===== Right column: entity graph ===== -->
  <!-- Root card -->
  <g>
    <rect x="754" y="120" width="330" height="150" rx="12" fill="#ffffff" stroke="#ddd" stroke-width="1.5"/>
    <text x="778" y="158" class="mono" font-size="14" font-weight="600" fill="#e8452c">project</text>
    <text x="778" y="184" class="display" font-size="20" font-weight="700" fill="#141414">Spring exhibition</text>
    <line x1="778" y1="206" x2="1060" y2="206" stroke="#e4e4e0" stroke-width="1"/>
    <text x="778" y="230" class="mono" font-size="14" fill="#999">lead</text>
    <text x="1060" y="230" class="mono" font-size="14" fill="#555" text-anchor="end">reference → Person</text>
    <text x="778" y="256" class="mono" font-size="14" fill="#999">budget used</text>
    <text x="1060" y="256" class="mono" font-size="14" fill="#e8452c" text-anchor="end">= 64%</text>
  </g>

  <!-- Connectors -->
  <line x1="919" y1="270" x2="919" y2="300" stroke="#d9d9d4" stroke-width="2"/>
  <line x1="838" y1="300" x2="1000" y2="300" stroke="#d9d9d4" stroke-width="2"/>
  <line x1="838" y1="300" x2="838" y2="330" stroke="#d9d9d4" stroke-width="2"/>
  <line x1="1000" y1="300" x2="1000" y2="330" stroke="#d9d9d4" stroke-width="2"/>

  <!-- Child cards -->
  <g>
    <rect x="754" y="330" width="164" height="96" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1.5"/>
    <text x="776" y="366" class="mono" font-size="12.5" font-weight="600" fill="#e8452c">tasks</text>
    <text x="776" y="392" class="display" font-size="16" font-weight="700" fill="#141414">Hang gallery A</text>
    <text x="776" y="412" class="mono" font-size="12" fill="#999">+ 23 more</text>
  </g>
  <g>
    <rect x="936" y="330" width="148" height="96" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1.5"/>
    <text x="958" y="366" class="mono" font-size="12.5" font-weight="600" fill="#e8452c">documents</text>
    <text x="958" y="392" class="display" font-size="15" font-weight="700" fill="#141414">Loan agreement</text>
    <text x="958" y="412" class="mono" font-size="12" fill="#999">file × 8</text>
  </g>

  <!-- Rights pill -->
  <rect x="784" y="454" width="322" height="40" rx="9" fill="#f2f1ed" stroke="#d9d9d4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="945" y="479" class="display" font-size="13.5" fill="#555" text-anchor="middle">editor: project team · viewer: management</text>
</svg>
