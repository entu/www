<svg width="100%" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Entu AI flow — creating a book entity type</title>
<desc>Three phases: a read-only chat turn where the AI plans and queues operations, a user review step with Apply or Cancel, and an apply phase where the API re-validates and writes to the database with the user's rights.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #1f2937; }
.ts { font-size: 12px; fill: #6b7280; }
.c-blue rect { fill: #dbeafe; stroke: #3b82f6; }
.c-green rect { fill: #dcfce7; stroke: #16a34a; }
.box { fill: #f5f5f5; stroke: #d4d4d4; }
.grp { fill: none; stroke: #9ca3af; stroke-width: 0.5; stroke-dasharray: 4 4; }
.arr { fill: none; stroke: #6b7280; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="760" rx="8" fill="#ffffff"/>
<rect x="40" y="50" width="600" height="290" rx="8" class="grp"/>
<text x="56" y="74" class="th">1 · Chat turn — nothing is written</text>
<g class="c-blue"><rect x="60" y="90" width="260" height="52" rx="4"/><text x="76" y="111" class="th">Entu AI chat</text><text x="76" y="128" class="ts">user asks for a book type</text></g>
<g class="c-blue"><rect x="360" y="90" width="260" height="52" rx="4"/><text x="376" y="111" class="th">POST /api/{db}/ai/chat</text><text x="376" y="128" class="ts">prompt from live config</text></g>
<line x1="322" y1="116" x2="356" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="60" y="180" width="260" height="52" rx="4"/><text x="76" y="201" class="th">AI model</text><text x="76" y="218" class="ts">agent loop, tool calls</text></g>
<rect x="360" y="180" width="260" height="52" rx="4" class="box"/><text x="376" y="201" class="th">Account database</text><text x="376" y="218" class="ts">read-only lookups</text>
<path d="M490 142 V161 H190 V176" class="arr" marker-end="url(#arrow)"/>
<line x1="324" y1="206" x2="356" y2="206" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="60" y="270" width="260" height="52" rx="4"/><text x="76" y="291" class="th">Proposal assembled</text><text x="76" y="308" class="ts">book $1 + properties queued</text></g>
<line x1="190" y1="232" x2="190" y2="266" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="600" height="110" rx="8" class="grp"/>
<text x="56" y="394" class="th">2 · User reviews</text>
<rect x="60" y="410" width="260" height="52" rx="4" class="box"/><text x="76" y="431" class="th">Proposed changes card</text><text x="76" y="448" class="ts">plain-language descriptions</text>
<rect x="360" y="410" width="260" height="52" rx="4" class="box"/><text x="376" y="431" class="th">Apply changes clicked</text><text x="376" y="448" class="ts">cancel ends it here</text>
<line x1="190" y1="322" x2="190" y2="406" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="436" x2="356" y2="436" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="510" width="600" height="200" rx="8" class="grp"/>
<text x="56" y="534" class="th">3 · Apply — writes as the user</text>
<g class="c-green"><rect x="360" y="550" width="260" height="52" rx="4"/><text x="376" y="571" class="th">POST /api/{db}/ai/execute</text><text x="376" y="588" class="ts">re-validates every operation</text></g>
<g class="c-green"><rect x="60" y="550" width="260" height="52" rx="4"/><text x="76" y="571" class="th">Saves each operation</text><text x="76" y="588" class="ts">rights checked, $1 resolved</text></g>
<line x1="490" y1="462" x2="490" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="358" y1="576" x2="324" y2="576" class="arr" marker-end="url(#arrow)"/>
<rect x="60" y="640" width="260" height="52" rx="4" class="box"/><text x="76" y="661" class="th">Account database</text><text x="76" y="678" class="ts">book type + its properties</text>
<g class="c-green"><rect x="360" y="640" width="260" height="52" rx="4"/><text x="376" y="661" class="th">Chat shows per-op results</text><text x="376" y="678" class="ts">type caches refreshed</text></g>
<line x1="190" y1="602" x2="190" y2="636" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="666" x2="356" y2="666" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="60" y="726" width="14" height="14" rx="3"/></g>
<text x="82" y="738" class="ts">read-only chat phase</text>
<g class="c-green"><rect x="240" y="726" width="14" height="14" rx="3"/></g>
<text x="262" y="738" class="ts">writes, only after confirm</text>
</svg>
